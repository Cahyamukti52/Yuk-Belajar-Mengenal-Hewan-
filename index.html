<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuk Belajar Mengenal Hewan!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #f0ebe6;
            text-align: center;
            margin: 0;
            padding: 20px;
            transition: background-color 0.5s ease;
        }

        h1 {
            color: #ff5722;
            font-size: 2.5rem;
            margin-top: 20px;
        }

        p {
            color: #4caf50;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .animal-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            width: 150px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 4px solid #ddd;
        }

        .animal-card:hover {
            transform: scale(1.05);
        }

        .animal-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        .animal-name {
            font-size: 1.5rem;
            color: #333;
            margin-top: 15px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <h1>🦁 Yuk Belajar Mengenal Hewan! 🐘</h1>
    <p>Klik pada hewan untuk mendengar suaranya ya!</p>

    <div class="container">
        
        <div class="animal-card" style="border-color: #ffb74d;" onclick="putarSuara('singa.mp3.mp3', '#fff3e0')">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=300&auto=format&fit=crop" alt="Singa">
            <h2 class="animal-name">Singa</h2>
        </div>

        <div class="animal-card" style="border-color: #90a4ae;" onclick="putarSuara('gajah.mp3.mp3', '#eceff1')">
            <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=300&auto=format&fit=crop" alt="Gajah">
            <h2 class="animal-name">Gajah</h2>
        </div>

        <div class="animal-card" style="border-color: #ff8a80;" onclick="putarSuara('kucing.mp3.mp3', '#ffebee')">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300&auto=format&fit=crop" alt="Kucing">
            <h2 class="animal-name">Kucing</h2>
        </div>

        <div class="animal-card" style="border-color: #a1887f;" onclick="putarSuara('sapi.mp3.mp3', '#efebe9')">
            <img src="https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?w=300&auto=format&fit=crop" alt="Sapi">
            <h2 class="animal-name">Sapi</h2>
        </div>

        <div class="animal-card" style="border-color: #ba68c8;" onclick="putarSuara('kambing.mp3.mp3', '#f3e5f5')">
            <img src="https://images.unsplash.com/photo-1484557985045-edf25e08da73?w=300&auto=format&fit=crop" alt="Kambing">
            <h2 class="animal-name">Kambing</h2>
        </div>

        <div class="animal-card" style="border-color: #4db6ac;" onclick="putarSuara('ikan.mp3.mp3', '#e0f2f1')">
            <img src="https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=300&auto=format&fit=crop" alt="Ikan">
            <h2 class="animal-name">Ikan</h2>
        </div>

        <div class="animal-card" style="border-color: #ff8a65;" onclick="putarSuara('anjing.mp3.mp3', '#fbe9e7')">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300&auto=format&fit=crop" alt="Anjing">
            <h2 class="animal-name">Anjing</h2>
        </div>

        <div class="animal-card" style="border-color: #ffd54f;" onclick="putarSuara('monyet.mp3.mp3', '#fffde7')">
            <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=300&auto=format&fit=crop" alt="Monyet">
            <h2 class="animal-name">Monyet</h2>
        </div>

        <div class="animal-card" style="border-color: #f06292;" onclick="putarSuara('babi.mp3.mp3', '#fce4ec')">
            <img src="https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=300&auto=format&fit=crop" alt="Babi">
            <h2 class="animal-name">Babi</h2>
        </div>

        <div class="animal-card" style="border-color: #e57373;" onclick="putarSuara('kelinci.mp3.mp3', '#ffebee')">
            <img src="https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=300&auto=format&fit=crop" alt="Kelinci">
            <h2 class="animal-name">Kelinci</h2>
        </div>

        <div class="animal-card" style="border-color: #ffb74d;" onclick="putarSuara('ayam.mp3.mp3', '#fff3e0')">
            <img src="https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=300&auto=format&fit=crop" alt="Ayam">
            <h2 class="animal-name">Ayam</h2>
        </div>

    </div>

    <script>
        let audioAktif = null;

        function putarSuara(namaFile, warnaBg) {
            document.body.style.backgroundColor = warnaBg;

            if (audioAktif) {
                audioAktif.pause();
                audioAktif.currentTime = 0;
            }

            audioAktif = new Audio(namaFile);
            audioAktif.play().catch(error => {
                console.log("Gagal memutar audio. Pastikan file audio berada di folder yang sama.");
            });
        }
    </script>

</body>
</html>
