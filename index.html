<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuk Belajar Mengenal Hewan!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            margin: 0;
            padding: 20px;
            transition: background-color 0.5s ease;
        }

        h1 {
            color: #ff5722;
            font-size: 2.5rem;
            text-shadow: 2px 2px #fff;
            margin-bottom: 10px;
        }

        p {
            color: #4caf50;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .animal-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            padding: 20px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid transparent;
        }

        .animal-card:hover {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }

        .card-singa { border-color: #ffb74d; }
        .card-gajah { border-color: #90a4ae; }
        .card-kucing { border-color: #ff8a80; }
        .card-sapi { border-color: #a1887f; }

        .animal-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .animal-name {
            font-size: 1.5rem;
            color: #333;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>🦁 Yuk Belajar Mengenal Hewan! 🐘</h1>
    <p>Klik pada hewan untuk mendengar suaranya ya!</p>

    <div class="container">
        
        <div class="animal-card card-singa" onclick="putarSuara('singa.mp3.mp3', '#fff3e0')">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=300&auto=format&fit=crop" alt="Singa">
            <h2 class="animal-name">Singa</h2>
        </div>

        <div class="animal-card card-gajah" onclick="putarSuara('gajah.mp3.mp3', '#eceff1')">
            <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=300&auto=format&fit=crop" alt="Gajah">
            <h2 class="animal-name">Gajah</h2>
        </div>

        <div class="animal-card card-kucing" onclick="putarSuara('kucing.mp3.mp3', '#ffebee')">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300&auto=format&fit=crop" alt="Kucing">
            <h2 class="animal-name">Kucing</h2>
        </div>

        <div class="animal-card card-sapi" onclick="putarSuara('sapi.mp3.mp3', '#efebe9')">
            <img src="https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?w=300&auto=format&fit=crop" alt="Sapi">
            <h2 class="animal-name">Sapi</h2>
        </div>

    </div>

    <script>
        let audioAktif = null;

        function putarSuara(namaFile, warnaBg) {
            document.body.style.backgroundColor = warnaBg;

            if (audioAktif) {
                audioAktif.pause();
                audioAktif.currentTime = 0;
            }

            audioAktif = new Audio(namaFile);
            audioAktif.play().catch(error => {
                console.log("Gagal memutar audio. Pastikan file audio berada di folder yang sama.");
            });
        }
    </script>

</body>
</html>
